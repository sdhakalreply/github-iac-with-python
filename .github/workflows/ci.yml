name: CI

on:
  push:
    branches:
      - feature/gitops-state
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Validate template.yaml
        run: python -c "from src.yaml_parser import parse_template; parse_template('template.yaml')"

      - name: Validate stress_template.yaml
        run: python -c "from src.validator import validate_file; validate_file('stress_template.yaml')"
